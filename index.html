<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Dashboard</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#14181f; --muted:#5b6573; --line:#e1e5ea; --good:#0a7d3b; --bad:#b3261e; --warn:#8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --card:#171b22; --fg:#e6e9ee; --muted:#9aa4b2; --line:#272d37; --good:#4cc47a; --bad:#ff7b72; --warn:#e3b341; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 4px } .sub { color:var(--muted); font-size:13px; margin-bottom:16px }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 6px }
  .big { font-size:26px; font-weight:600 } .wide { grid-column:1/-1 }
  table { width:100%; border-collapse:collapse; font-size:13px } th,td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line) }
  .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} #err { color:var(--bad); margin-bottom:12px }
</style>
</head>
<body>
<main>
  <h1>Trading dashboard <span id="mode" class="sub"></span></h1>
  <div class="sub">Read-only. <span id="updated">loading…</span></div>
  <div id="err"></div>
  <div class="grid">
    <div class="card"><h2>Bot status</h2><div class="big" id="bot">–</div></div>
    <div class="card"><h2>Available cash</h2><div class="big" id="cash">–</div></div>
    <div class="card"><h2>Daily P&amp;L</h2><div class="big" id="pnl">–</div><div class="sub" id="pnl2"></div></div>
    <div class="card"><h2>Savings ledger</h2><div class="big" id="sav">–</div><div class="sub" id="pw"></div></div>
    <div class="card wide"><h2>Open positions</h2><table id="pos"></table></div>
    <div class="card wide"><h2>Last 5 signals</h2><table id="sig"></table></div>
    <div class="card wide"><h2>Latest Risk Engine rejections</h2><table id="rej"></table></div>
  </div>
</main>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const usd = n => (n == null ? "–" : (n < 0 ? "-$" : "$") + Math.abs(n).toFixed(2));
function fill(table, head, rows) {
  table.replaceChildren();
  const hr = table.insertRow();
  head.forEach(h => { const th = document.createElement("th"); th.textContent = h; hr.appendChild(th); });
  if (!rows.length) { const r = table.insertRow(); const c = r.insertCell(); c.colSpan = head.length; c.textContent = "none"; return; }
  rows.forEach(row => { const r = table.insertRow(); row.forEach(v => { r.insertCell().textContent = v ?? "–"; }); });
}
async function load() {
  try {
    const base = (window.TRADING_CONFIG || {}).API_URL;
    if (!base) throw new Error("API_URL not set in config.js");
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 70000); // Render cold start ≈ 1 min
    const s = await (await fetch(base.replace(/\/$/, "") + "/status", { signal: ctl.signal })).json();
    $("err").textContent = "";
    $("bot").textContent = s.bot; $("mode").textContent = "(" + s.mode + ")";
    $("cash").textContent = usd(s.account && s.account.cash);
    const d = s.daily_pnl || {};
    $("pnl").textContent = usd(d.total); $("pnl").className = "big " + ((d.total || 0) >= 0 ? "good" : "bad");
    $("pnl2").textContent = "realized " + usd(d.realized) + " · unrealized " + usd(d.unrealized);
    $("sav").textContent = usd(s.savings.accumulated);
    $("pw").textContent = s.savings.pending_withdrawal ? "pending withdrawal: YES (withdraw manually in Alpaca)" : "pending withdrawal: no";
    $("pw").className = "sub " + (s.savings.pending_withdrawal ? "warn" : "");
    fill($("pos"), ["Symbol", "Qty", "Unrealized P&L"], (s.positions || []).map(p => [p.symbol, p.qty, usd(p.unrealized_pl)]));
    fill($("sig"), ["Time", "Symbol", "Direction", "Confidence", "Result"], (s.last_signals || []).map(x => [x.timestamp, x.symbol, x.direction, x.confidence, x.result]));
    fill($("rej"), ["Time", "Symbol", "Rule", "Reason"], (s.rejections || []).map(x => [x.timestamp, x.symbol, x.rule, x.reason]));
    $("updated").textContent = "updated " + new Date().toLocaleTimeString() + " · last cycle " + (s.last_cycle || "n/a");
  } catch (e) { $("err").textContent = "Could not load status: " + e.message; }
}
load(); setInterval(load, 30000);
</script>
</body>
</html>
