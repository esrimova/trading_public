name: keep-alive
on:
  schedule:
    - cron: "*/14 * * * *"   # every 14 min (Actions minimum is 5). Best-effort: runs can be delayed/dropped.
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then echo "Repository variable BACKEND_URL is not set"; exit 1; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 "${BACKEND_URL%/}/health"
